name: rideup
description: RideUp – app mobile pour motards

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.8.1

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # HTTP
  dio: ^5.8.0+1

  # Supabase (Auth + DB + Realtime + Storage)
  supabase_flutter: ^2.9.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Geolocation
  geolocator: ^13.0.2

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # WebSocket
  web_socket_channel: ^3.0.1

  # Push notifications
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # Utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  riverpod_generator: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
